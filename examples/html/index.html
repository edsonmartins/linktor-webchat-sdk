<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linktor WebChat — exemplo HTML puro</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 720px;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.6;
        color: #1f2937;
      }
      code {
        background: #f3f4f6;
        padding: 0.15em 0.35em;
        border-radius: 4px;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1.5rem;
      }
      button {
        padding: 0.5rem 0.9rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:hover {
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <h1>Linktor WebChat — HTML puro</h1>
    <p>
      Uma única tag <code>&lt;script&gt;</code> carrega o widget. Ajuste
      <code>channelId</code> e <code>baseUrl</code> abaixo. Os botões demonstram a
      API programática <code>linktor('open')</code>, etc.
    </p>

    <div class="row">
      <button onclick="linktor('open')">Abrir</button>
      <button onclick="linktor('close')">Fechar</button>
      <button onclick="linktor('toggle')">Alternar</button>
      <button onclick="linktor('sendMessage', 'Olá do exemplo!')">Enviar mensagem</button>
    </div>

    <!-- ===== Snippet de adoção (copie para o seu site) ===== -->
    <script>
      (function (l, i, n, k, t, o, r) {
        l['LinktorObject'] = t
        l[t] =
          l[t] ||
          function () {
            ;(l[t].q = l[t].q || []).push(arguments)
          }
        o = i.createElement(n)
        r = i.getElementsByTagName(n)[0]
        o.async = 1
        o.src = k
        r.parentNode.insertBefore(o, r)
      })(window, document, 'script', '../../packages/loader/dist/linktor.js', 'linktor')

      linktor('init', {
        channelId: 'YOUR_CHANNEL_ID',
        baseUrl: 'https://api.linktor.dev',
        title: 'Fale conosco',
        primaryColor: '#4f46e5',
        position: 'right',
        visitor: { name: 'Visitante Demo', email: 'demo@example.com' },
      })

      linktor('updateUser', { name: 'Edson' })
    </script>
  </body>
</html>
